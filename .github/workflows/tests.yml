name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ["android/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check mmebel tests --select F,E9,B --ignore E501
      - run: pytest -q
      - run: node --check mmebel/web/static/app.js
