name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Imzo kaliti
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::GitHub Secrets'da ANDROID_KEYSTORE_B64 yo'q (README → Android bo'limi)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: APK yig'ish
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: mmebel
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Xatoni annotatsiyaga chiqaramiz (loglarni ochmasdan ko'rish uchun)
            MSG=$(grep -E "^e: |error:|What went wrong|Could not|> |FAILURE|Exception" "$RUNNER_TEMP/build.log" | head -40)
            MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
            echo "::error title=Gradle xatosi::$MSG"
            exit 1
          fi
      - name: Imzoni tekshirish
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if ! "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/sig.txt" 2>&1; then
            echo "::error title=Imzo xatosi::$(head -5 "$RUNNER_TEMP/sig.txt" | tr '\n' ' ')"; exit 1
          fi
          head -3 "$RUNNER_TEMP/sig.txt"
          cp "$APK" mmebel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mmebel-apk
          path: mmebel.apk
      - name: Release (doimiy havola)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          gh release create "$TAG" mmebel.apk --title "MMebel Android 1.0.${{ github.run_number }}" \
            --notes "Android ilova. O'rnatish: mmebel.apk ni yuklab, oching." --latest
