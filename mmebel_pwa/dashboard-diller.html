<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MMebel вЂ” Diller</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f0f2f5;--surface:#fff;--surface2:#f5f5f5;--border:rgba(0,0,0,0.09);--text:#1a1a1a;--text2:#666;--text3:#999;--green:#1D9E75;--green-l:#e8f5ee;--green-d:#0f6e56;--amber:#BA7517;--amber-l:#faeeda;--red:#c0392b;--red-l:#fdeaea;--blue:#185FA5;--blue-l:#e6f1fb;--nav-h:64px;--hdr-h:56px}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:rgba(255,255,255,0.08);--text:#f0f0f0;--text2:#999;--text3:#666;--green-l:#0d2e1f;--amber-l:#2e1f05;--red-l:#2e0a0a;--blue-l:#071e38}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(var(--nav-h) + 16px)}
.hdr{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);height:var(--hdr-h);display:flex;align-items:center;padding:0 16px;gap:12px}
.hdr-logo{width:34px;height:34px;background:linear-gradient(135deg,#1D9E75,#0f6e56);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.hdr-info{flex:1}.hdr-title{font-size:16px;font-weight:700}.hdr-sub{font-size:12px;color:var(--text2)}
.hdr-btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.hdr-logout{background:var(--red-l);color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--text2);padding:8px 4px;transition:color .2s;position:relative}
.nav-btn.active{color:var(--green)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2.5px;background:var(--green);border-radius:0 0 3px 3px}
.nav-icon{font-size:22px}
.page{display:none;padding:16px}.page.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-amber{background:var(--amber-l);color:var(--amber)}.badge-green{background:var(--green-l);color:var(--green-d)}.badge-blue{background:var(--blue-l);color:var(--blue)}.badge-red{background:var(--red-l);color:var(--red)}.badge-gray{background:var(--surface2);color:var(--text2)}
.sec-title{font-size:17px;font-weight:700;margin-bottom:14px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.prod-name{font-size:14px;font-weight:700;margin-bottom:6px}
.prod-price{font-size:20px;font-weight:800;color:var(--green)}
.prod-qty{font-size:12px;color:var(--text2);margin-top:4px}
.debt-box{background:linear-gradient(135deg,#1D9E75,#0f6e56);border-radius:20px;padding:24px;margin-bottom:16px;text-align:center;color:#fff}
.debt-label{font-size:14px;opacity:.8;margin-bottom:8px}
.debt-amount{font-size:40px;font-weight:900;letter-spacing:-2px}
.form-row{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-ctrl{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-ctrl:focus{border-color:var(--green);background:var(--surface)}
.btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-green{background:linear-gradient(135deg,#1D9E75,#0f6e56);color:#fff;box-shadow:0 4px 14px rgba(29,158,117,.35)}
.btn-red{background:var(--red-l);color:var(--red)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;backdrop-filter:blur(2px)}
.modal.open{display:flex;animation:mIn .25s}
@keyframes mIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:0;max-height:92vh;overflow-y:auto;animation:mBoxIn .25s}
@keyframes mBoxIn{from{transform:translateY(60px)}to{transform:none}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--text2)}
.modal-body{padding:20px}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:10px;height:80px;margin-bottom:10px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast-w{position:fixed;top:20px;left:0;right:0;display:flex;justify-content:center;z-index:999;pointer-events:none}
.toast{padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(-80px);transition:transform .3s;pointer-events:none;max-width:300px;text-align:center}
.toast.show{transform:none}.toast.ok{background:var(--green);color:#fff}.toast.err{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="toast-w"><div class="toast" id="toast"></div></div>
<div class="hdr">
  <div class="hdr-logo">D</div>
  <div class="hdr-info">
    <div class="hdr-title" id="hdr-title">Diller</div>
    <div class="hdr-sub" id="hdr-sub">Yuklanmoqda...</div>
  </div>
  <button class="hdr-btn hdr-logout" onclick="logout()">Chiqish</button>
</div>

<!-- MEBELLAR -->
<div class="page active" id="p-meb">
  <div class="sec-title">Sotuvdagi mebellar</div>
  <div class="prod-grid" id="meb-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<!-- ZAKAZLARIM -->
<div class="page" id="p-zak">
  <div class="sec-title">Mening zakazlarim</div>
  <div id="zak-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<!-- ZAKAZ BERISH -->
<div class="page" id="p-new">
  <div class="sec-title">Zakaz berish</div>
  <div class="form-row"><label class="form-label">Mebel</label>
    <select class="form-ctrl" id="nz-prod">
      <option>BF 06</option><option>BF 07</option><option>BF 09</option><option>BF 12</option>
      <option>BF 14</option><option>BF 15</option><option>BF 18</option><option>BF 244</option>
      <option>BF 264</option><option>BF 274</option><option>BF 294</option><option>BF 246</option>
      <option>BF 266</option><option>BF 276</option><option>BF 296</option><option>BF 32</option>
      <option>BF 33</option><option>BF 34</option><option>BF 35</option><option>BF 37</option>
      <option>BF 38</option><option>BF 39</option><option>BF 44</option><option>BF 45</option>
      <option>BF 544</option><option>BF 574</option><option>BF 594</option><option>BF 63</option>
      <option>BF 64</option><option>BF 65</option><option>BF 68</option><option>BF 707</option>
      <option>BF 708</option><option>BF 709</option><option>BF 762</option><option>BF 752</option>
      <option>BF 772</option><option>KR 792</option><option>BF 87</option><option>BF 773</option><option>D 100</option><option>D 106</option>
      <option>D 109</option><option>D 50</option><option>D 59</option><option>D 003</option>
      <option>D 004</option><option>D 006</option><option>D 005</option><option value="__custom">Boshqa</option>
    </select>
  </div>
  <div id="nz-custprod-wrap" style="display:none" class="form-row"><label class="form-label">Mebel nomi</label><input class="form-ctrl" id="nz-custom-prod" placeholder="Mebel nomi"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="form-row"><label class="form-label">Soni</label><input class="form-ctrl" id="nz-amount" type="number" value="1" min="1"></div>
    <div class="form-row"><label class="form-label">Narxi ($)</label><input class="form-ctrl" id="nz-price" type="number" placeholder="0"></div>
  </div>
  <div class="form-row"><label class="form-label">Muddat (qachon kerak)</label><input class="form-ctrl" id="nz-date" type="date"></div>
  <div class="form-row"><label class="form-label">Izoh</label><input class="form-ctrl" id="nz-comment" placeholder="Ixtiyoriy..."></div>
  <button class="btn btn-green" onclick="submitZakaz()">рџ“ќ Zakaz berish</button>
</div>

<!-- TO'LOV / QARZ -->
<div class="page" id="p-pay">
  <div class="debt-box">
    <div class="debt-label">Joriy qarz</div>
    <div class="debt-amount" id="debt-val">...</div>
  </div>
  <div class="sec-title" style="font-size:15px">To'lov tarixi</div>
  <div id="pay-list"><div class="skel"></div><div class="skel"></div></div>
</div>

<nav>
  <button class="nav-btn active" onclick="showPage('p-meb',this)"><span class="nav-icon">рџ›‹</span>Mebellar</button>
  <button class="nav-btn" onclick="showPage('p-zak',this)"><span class="nav-icon">рџ“‹</span>Zakazlar</button>
  <button class="nav-btn" onclick="showPage('p-new',this)"><span class="nav-icon">вћ•</span>Zakaz</button>
  <button class="nav-btn" onclick="showPage('p-pay',this)"><span class="nav-icon">рџ’°</span>To'lov</button>
</nav>

<!-- Modal: Cancel zakaz -->
<div class="modal" id="m-cancel" onclick="if(event.target===this)closeModal('m-cancel')">
<div class="modal-box">
  <div class="modal-hdr"><span class="modal-title">Zakazni bekor qilish</span><button class="modal-close" onclick="closeModal('m-cancel')">Г—</button></div>
  <div class="modal-body">
    <div id="m-cancel-info" style="padding:12px;background:var(--surface2);border-radius:10px;margin-bottom:16px;font-size:14px;color:var(--text2)"></div>
    <p style="font-size:15px;margin-bottom:16px">Zakazni bekor qilmoqchimisiz?</p>
    <button class="btn btn-red" onclick="doCancel()">вњ• Ha, bekor qilish</button>
    <button class="btn" style="background:var(--surface2);color:var(--text2);margin-top:10px" onclick="closeModal('m-cancel')">Yo'q</button>
  </div>
</div></div>

<script>
const FB={apiKey:"AIzaSyDwaAPfFIDgpgYudGH0zVOR9ju7XD9Lflk",authDomain:"mmebel-bot.firebaseapp.com",databaseURL:"https://mmebel-bot-default-rtdb.europe-west1.firebasedatabase.app",projectId:"mmebel-bot",storageBucket:"mmebel-bot.appspot.com",messagingSenderId:"XXXXXXXXXXXX",appId:"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"};
firebase.initializeApp(FB);
const db=firebase.database(), auth=firebase.auth();
const user=JSON.parse(localStorage.getItem('mmebel_user')||'null');
if(!user||user.role!=='diller') window.location.replace('login.html');
const CLIENT=user.client_name||user.name||'Diller';
document.getElementById('hdr-title').textContent=CLIENT;
document.getElementById('hdr-sub').textContent='Diller paneli';

function toast(msg,type='ok'){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);
}
function fMoney(n){return '$'+Number(n||0).toLocaleString('en-US');}
function fDate(d){
  if(!d)return'вЂ”';if(d.includes('-')&&d.length===10){const[y,m,dd]=d.split('-');return`${dd}.${m}.${y}`;}
  try{const dt=new Date(d);return`${dt.getDate()}.${dt.getMonth()+1}.${dt.getFullYear()}`;}catch{return d;}
}
function getBadge(st){
  const map={'Tayyorlanmoqda':'badge-amber','Tayyor bo\'ldi':'badge-blue','Yuborildi':'badge-blue','Biz yetkazib berdik':'badge-green','Dillerni o\'zi olib ketdi':'badge-green','Hisob kitob qilindi':'badge-green','Bekor qilindi':'badge-red'};
  return `<span class="badge ${map[st]||'badge-gray'}">${st}</span>`;
}
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');btn.classList.add('active');
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// Mebellar
db.ref('mebellar').on('value',snap=>{
  const arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));
  document.getElementById('meb-list').innerHTML=arr.map(p=>`
    <div class="prod-card">
      <div class="prod-name">${p.id}</div>
      <div class="prod-price">${fMoney(p.narxi)}</div>
      <div class="prod-qty">${p.soni||0} ta omborda</div>
    </div>`).join('')||'<div class="empty"><div class="empty-text">Mebellar yo\'q</div></div>';
});

// Zakazlar
db.ref('orders').orderByChild('client_name').equalTo(CLIENT).on('value',snap=>{
  const arr=[];snap.forEach(c=>arr.push({id:c.key,...c.val()}));arr.reverse();
  const el=document.getElementById('zak-list');
  if(!arr.length){el.innerHTML='<div class="empty"><div class="empty-icon">рџ“­</div><div class="empty-text">Zakazlar yo\'q</div></div>';return;}
  el.innerHTML=arr.map(o=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div style="font-size:15px;font-weight:700">${o.product_id}</div><div style="font-size:13px;color:var(--text2)">${o.amount} ta${o.price?` В· ${fMoney(o.price)}`:''}</div></div>
        ${getBadge(o.status)}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--text3)">рџ“… ${fDate(o.due_date)}</span>
        ${o.status==='Tayyorlanmoqda'?`<button onclick="openCancel('${o.id}','${o.product_id}')" style="padding:6px 12px;border-radius:8px;border:none;background:var(--red-l);color:var(--red);font-size:12px;font-weight:600;cursor:pointer">Bekor</button>`:''}
      </div>
    </div>`).join('');
});

let cancelId=null;
function openCancel(id,name){cancelId=id;document.getElementById('m-cancel-info').textContent=name+' вЂ” zakazni bekor qilish';openModal('m-cancel');}
function doCancel(){
  if(!cancelId)return;
  db.ref('orders/'+cancelId+'/status').set('Bekor qilindi')
    .then(()=>{closeModal('m-cancel');toast('Zakaz bekor qilindi');cancelId=null;})
    .catch(()=>toast('Xato!','err'));
}

// New zakaz
document.getElementById('nz-prod').addEventListener('change',function(){
  document.getElementById('nz-custprod-wrap').style.display=this.value==='__custom'?'block':'none';
});
document.getElementById('nz-date').value=new Date(Date.now()+86400000).toISOString().split('T')[0];

function submitZakaz(){
  let prod=document.getElementById('nz-prod').value;
  if(prod==='__custom')prod=document.getElementById('nz-custom-prod').value.trim();
  const amount=parseInt(document.getElementById('nz-amount').value)||1;
  const price=parseFloat(document.getElementById('nz-price').value)||0;
  const date=document.getElementById('nz-date').value;
  const comment=document.getElementById('nz-comment').value.trim();
  if(!prod||!date)return toast('Barcha maydonlarni to\'ldiring','err');
  db.ref('orders').push({
    client_name:CLIENT,product_id:prod,amount,price,total_price:price*amount,
    due_date:date,comment,status:'Tayyorlanmoqda',created_at:new Date().toISOString()
  }).then(()=>{toast('Zakaz berildi вњ“');document.getElementById('nz-amount').value='1';document.getElementById('nz-price').value='';document.getElementById('nz-comment').value='';})
    .catch(()=>toast('Xato!','err'));
}

// Debt
db.ref('debts/'+CLIENT).on('value',snap=>{
  const a=snap.val()?.amount||0;
  document.getElementById('debt-val').textContent=fMoney(a);
});
db.ref('accounting_history/'+CLIENT).limitToLast(30).on('value',snap=>{
  const arr=[];snap.forEach(c=>arr.push(c.val()));arr.reverse();
  document.getElementById('pay-list').innerHTML=arr.length?arr.map(h=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><span style="font-weight:600">${h.product_id||'вЂ”'}</span><span style="color:var(--green);font-weight:700">${fMoney(h.total_price||h.price)}</span></div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">${h.accounting_type||''} В· ${fDate(h.accounting_date)}</div>
      ${h.note?`<div style="font-size:12px;color:var(--text3);margin-top:2px">${h.note}</div>`:''}
    </div>`).join(''):
    '<div class="empty"><div class="empty-text">To\'lov tarixi yo\'q</div></div>';
});

function logout(){
  if(confirm('Chiqmoqchimisiz?')){localStorage.removeItem('mmebel_user');auth.signOut().finally(()=>window.location.replace('login.html'));}
}
</script>
</body>
</html>
